<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
html,body{margin:0;background:#07030f;width:1080px;height:1920px;overflow:hidden}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// FLASH 15s animated promo. Everything is drawn from render(t); 120 BPM -> beat = 0.5s.
const W = 1080, H = 1920, GROUND = 1400, BEAT = 0.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const YELLOW = '#ffd21f', CYAN = '#22e6ff', MAGENTA = '#ff2d95';
const COLOR = {
  gray:  {img:'cut/gray_swap.png',  name:'GRAY',  neon:CYAN},
  black: {img:'cut/black_swap.png', name:'BLACK', neon:MAGENTA},
  white: {img:'cut/white_swap.png', name:'WHITE', neon:YELLOW},
};
const IM = {};
window.ready = Promise.all([...Object.entries(COLOR).map(([k,c]) => new Promise(r => {
  const i = new Image(); i.onload = () => { IM[k] = i; IM[k+'_c'] = tint(i, CYAN); IM[k+'_m'] = tint(i, MAGENTA); r(); }; i.src = c.img;
})), document.fonts.load('300px Anton'), document.fonts.load('800 40px Inter'), document.fonts.load('600 40px Inter')]);
function tint(img, col){               // solid-colour silhouette for RGB-split glitches
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d'); x.drawImage(img,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=col; x.fillRect(0,0,c.width,c.height);
  return c;
}

// ---------- helpers ----------
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eIn = x => Math.pow(clamp(x), 3);
const eBack = x => { x = clamp(x); const c = 2.2; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
function rng(seed){ let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const hash = n => { const r = rng(n * 9301 + 49297); r(); return r(); };
const lerp = (a,b,x) => a + (b-a)*x;

// world scroll distance (px) – integrates speed so accelerations feel physical
function speed(t){
  if (t < 2) return 0;
  if (t < 2.6) return lerp(900, 2600, eOut(prog(t,2,2.6)));
  if (t < 11) return 2600;
  if (t < 12) return lerp(2600, 5200, eIn(prog(t,11,11.8)));
  return lerp(2400, 700, eOut(prog(t,12,13)));
}
function dist(t){ let d = 0; for (let x = 0; x < t; x += 1/240) d += speed(x)/240; return d; }

// impacts drive shake + flash
const LETTER_T = [0.5,0.625,0.75,0.875,1.0];
const SWAP_T = [5,5.5,6,6.5,7,7.5];
const FEAT_T = [8,8.5,9,9.5,10,10.5];
const HITS = [[0,1],[2,0.9],[3.5,0.6],...LETTER_T.map(x=>[x,0.35]),...SWAP_T.map(x=>[x,0.55]),...FEAT_T.map(x=>[x,0.4]),[11.75,0.8],[12,1]];
function impact(t){ let s = 0; for (const [h,a] of HITS) if (t >= h && t < h + 0.3) s = Math.max(s, a * Math.pow(1 - (t-h)/0.3, 2)); return s; }
function flashAmt(t){ let f = 0; for (const [h,a] of HITS) if (t >= h && t < h + 0.1) f = Math.max(f, a * 0.85 * (1 - (t-h)/0.1)); return f; }

function currentColor(t){
  if (t < 5) return 'gray';
  if (t < 8) return ['gray','black','white'][Math.floor((t-5)/BEAT) % 3];
  if (t < 12) return ['gray','black','white'][Math.floor((t-8)/1) % 3];
  return 'gray';
}

// ---------- background ----------
const FAR = [], NEAR = [], STARS = [];
{ const r = rng(11); let x = 0; while (x < 2400) { const w = 70 + r()*140; FAR.push({x, w, h: 140 + r()*380, s: r()}); x += w + 4; } }
{ const r = rng(23); let x = 0; while (x < 2600) { const w = 110 + r()*170; NEAR.push({x, w, h: 260 + r()*560, s: r(), ant: r() < 0.25}); x += w + 10; } }
{ const r = rng(5); for (let i = 0; i < 90; i++) STARS.push({x: r()*W, y: r()*900, a: 0.3 + r()*0.7}); }

function sky(neon, t){
  const g = ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,'#05020d'); g.addColorStop(0.55,'#1a0636'); g.addColorStop(0.86,'#4a0b54'); g.addColorStop(1,'#7a1250');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,GROUND);
  STARS.forEach((s,i) => { ctx.globalAlpha = s.a * (0.6 + 0.4*Math.sin(t*3 + i)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, 3, 3); });
  ctx.globalAlpha = 1;
  // big retro sun behind the skyline
  const sy = 1060, sr = 330;
  const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr);
  sg.addColorStop(0, YELLOW); sg.addColorStop(0.6, MAGENTA); sg.addColorStop(1, '#6a0d6e');
  ctx.save(); ctx.beginPath(); ctx.arc(540, sy, sr, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = sg; ctx.fillRect(540 - sr, sy - sr, sr*2, sr*2);
  ctx.fillStyle = '#1a0636';
  for (let i = 0; i < 9; i++) { const y = sy - 40 + i*38 + ((t*40) % 38); ctx.fillRect(540 - sr, y, sr*2, 4 + i*2.2); }
  ctx.restore();
  // neon glow at horizon
  const hg = ctx.createLinearGradient(0, GROUND - 260, 0, GROUND);
  hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(1, neon + '66');
  ctx.fillStyle = hg; ctx.fillRect(0, GROUND - 260, W, 260);
}
function skyline(list, span, off, base, col, winCol, t){
  for (const b of list) {
    let x = ((b.x + off) % span + span) % span - 300;
    if (x > W || x + b.w < 0) continue;
    ctx.fillStyle = col; ctx.fillRect(x, base - b.h, b.w, b.h);
    if (b.ant) { ctx.fillRect(x + b.w/2 - 3, base - b.h - 80, 6, 80); ctx.fillStyle = (Math.floor(t*2 + b.s*4) % 2) ? '#ff3355' : '#551122'; ctx.beginPath(); ctx.arc(x + b.w/2, base - b.h - 82, 8, 0, 7); ctx.fill(); }
    const r = rng(Math.floor(b.x));
    for (let wy = base - b.h + 24; wy < base - 20; wy += 34) for (let wx = x + 14; wx < x + b.w - 20; wx += 28)
      if (r() < 0.42) { ctx.fillStyle = r() < 0.5 ? winCol : '#ffd98a'; ctx.globalAlpha = 0.35 + r()*0.6; ctx.fillRect(wx, wy, 12, 16); }
    ctx.globalAlpha = 1;
  }
}
function road(d, neon, GROUND = window.GROUND_Y || 1400){
  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, '#16101f'); g.addColorStop(1, '#040208');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, H - GROUND);
  // neon kerb line
  ctx.save(); ctx.shadowColor = neon; ctx.shadowBlur = 30; ctx.fillStyle = neon; ctx.fillRect(0, GROUND - 3, W, 6); ctx.restore();
  // lane dashes, stretched by speed (motion blur)
  const period = 300, off = d % period;
  for (let x = -period + off; x < W + period; x += period) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(x, GROUND < 1400 ? 1830 : GROUND + 160, 170, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x - 120, GROUND < 1400 ? 1831 : GROUND + 161, 120, 10);
  }
  // wet-road reflection of the sun / neon
  const rg = ctx.createRadialGradient(540, GROUND + 40, 10, 540, GROUND + 40, 520);
  rg.addColorStop(0, neon + '55'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, GROUND, W, 520);
}
function streetlights(d, neon){
  const span = 820;
  for (let i = -1; i < 3; i++) {
    const x = ((d * 0.8) % span) + i * span - 200;
    ctx.fillStyle = '#0c0816'; ctx.fillRect(x, 640, 16, GROUND - 640); ctx.fillRect(x - 110, 640, 126, 12);
    ctx.save(); ctx.shadowColor = neon; ctx.shadowBlur = 50; ctx.fillStyle = '#fff'; ctx.fillRect(x - 120, 652, 70, 8); ctx.restore();
    const cg = ctx.createLinearGradient(0, 660, 0, GROUND);
    cg.addColorStop(0, neon + '44'); cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(x - 120, 660); ctx.lineTo(x - 50, 660); ctx.lineTo(x + 40, GROUND); ctx.lineTo(x - 220, GROUND); ctx.fill();
  }
}
function speedLines(t, amt, col){
  if (amt <= 0) return;
  const r = rng(99);
  for (let i = 0; i < 38; i++) {
    const y = 150 + r()*1700, len = 200 + r()*600, v = 2500 + r()*3500, ph = r();
    const x = ((t * v + ph * 3000) % (W + len + 400)) - len - 200;
    const g = ctx.createLinearGradient(x, 0, x + len, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, i % 3 ? 'rgba(255,255,255,0.55)' : col);
    ctx.globalAlpha = amt; ctx.fillStyle = g; ctx.fillRect(x, y, len, i % 5 ? 3 : 6);
  }
  ctx.globalAlpha = 1;
}

// ---------- bike ----------
function drawBike(key, cx, groundY, scale, t, opts = {}){
  const im = IM[key], w = im.width * scale, h = im.height * scale;
  const bob = Math.sin(t * Math.PI * 2 * 7) * 2.5 + Math.sin(t * Math.PI * 2 * 2.3) * 2;
  const x = cx - w/2, y = groundY - h + 18*scale + bob;
  const neon = COLOR[key].neon;
  // headlight beam (bike faces left)
  if (opts.beam !== false) {
    const hx = x + 150*scale, hy = y + 300*scale;
    const bg = ctx.createLinearGradient(hx, 0, hx - 900, 0);
    bg.addColorStop(0, 'rgba(255,250,220,0.32)'); bg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(hx, hy - 12); ctx.lineTo(hx - 900, hy - 160); ctx.lineTo(hx - 900, hy + 260); ctx.lineTo(hx, hy + 18); ctx.fill();
    ctx.save(); ctx.shadowColor = '#fff6c8'; ctx.shadowBlur = 60; ctx.fillStyle = '#fffbe6'; ctx.beginPath(); ctx.ellipse(hx + 10, hy, 16, 26, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // under-glow on the road
  const ug = ctx.createRadialGradient(cx, groundY + 10, 10, cx, groundY + 10, w*0.6);
  ug.addColorStop(0, neon + 'aa'); ug.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(cx, groundY + 10); ctx.scale(1, 0.16); ctx.translate(-cx, -(groundY + 10)); ctx.fillStyle = ug; ctx.beginPath(); ctx.arc(cx, groundY + 10, w*0.6, 0, 7); ctx.fill(); ctx.restore();
  // ghost trail
  const trail = opts.trail || 0;
  for (let i = 3; i >= 1 && trail > 0; i--) { ctx.globalAlpha = 0.18 * trail * (1 - i/4); ctx.drawImage(IM[key + (i % 2 ? '_c' : '_m')], x + i * 70 * trail, y, w, h); }
  ctx.globalAlpha = 1;
  // glitch: RGB split + sliced offsets
  const g = opts.glitch || 0;
  if (g > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.7 * g; ctx.drawImage(IM[key+'_c'], x - 26*g, y, w, h); ctx.drawImage(IM[key+'_m'], x + 26*g, y, w, h);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    const r = rng(Math.floor(t * 60) + 7), slices = 14;
    for (let s = 0; s < slices; s++) {
      const sy = im.height * s / slices, sh = im.height / slices, dx = (r() - 0.5) * 90 * g * (r() < 0.5 ? 1 : 0);
      ctx.drawImage(im, 0, sy, im.width, sh, x + dx, y + sy*scale, w, sh*scale);
    }
  } else ctx.drawImage(im, x, y, w, h);
  // tail light glow
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = '#ff2040'; ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(255,40,60,0.6)';
  ctx.beginPath(); ctx.ellipse(x + 1000*scale, y + 312*scale, 20*scale, 12*scale, 0, 0, 7); ctx.fill(); ctx.restore();
  // sparks off the rear tyre
  if (opts.sparks) {
    const r = rng(Math.floor(t * 30));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 16; i++) {
      const px = x + 920*scale + r()*260 + ((t*900) % 120), py = groundY - r()*40, l = 30 + r()*70;
      ctx.strokeStyle = i % 2 ? YELLOW : '#ffffff'; ctx.globalAlpha = 0.4 + r()*0.5; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + l, py - l*0.25); ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

// ---------- type ----------
function rgbText(txt, x, y, font, split, fill = '#fff', align = 'center'){
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (split > 0.5) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = CYAN; ctx.fillText(txt, x - split, y); ctx.fillStyle = MAGENTA; ctx.fillText(txt, x + split, y);
    ctx.restore();
  }
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function bolt(seed, x0, y0, x1, y1, width, col){
  const r = rng(seed), pts = [[x0,y0]], n = 16;
  for (let i = 1; i < n; i++) { const k = i/n; pts.push([lerp(x0,x1,k) + (r()-0.5)*170, lerp(y0,y1,k) + (r()-0.5)*40]); }
  pts.push([x1,y1]);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round';
  for (const [lw, a, blur] of [[width*4, 0.35, 60], [width, 1, 20]]) {
    ctx.strokeStyle = a === 1 ? '#ffffff' : col; ctx.globalAlpha = a; ctx.lineWidth = lw; ctx.shadowColor = col; ctx.shadowBlur = blur;
    ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
    // a couple of branches
    for (let b = 0; b < 3; b++) { const p = pts[3 + b*4]; ctx.beginPath(); ctx.moveTo(p[0],p[1]); let bx = p[0], by = p[1];
      for (let s = 0; s < 4; s++) { bx += (r()-0.3)*120; by += 50 + r()*60; ctx.lineTo(bx,by); } ctx.lineWidth = lw*0.5; ctx.stroke(); }
  }
  ctx.restore();
}
function pill(x, y, w, h, fill){ ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fillStyle = fill; ctx.fill(); }

const FEATS = ['STREET-LEGAL', 'ABS + TCS', 'APPLE CARPLAY', 'ANDROID AUTO', 'REMOVABLE BATTERY', '2-UP SEATING'];

// ---------- frame ----------
window.render = function(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#07030f'; ctx.fillRect(0,0,W,H);
  const shake = impact(t) * 26, sr = rng(Math.floor(t*60) + 3);
  ctx.translate((sr()-0.5)*shake, (sr()-0.5)*shake);
  const key = currentColor(t), neon = COLOR[key].neon, d = dist(t);

  // ===== 0-2s: lightning + FLASH letters =====
  if (t < 2) {
    const bg = ctx.createRadialGradient(540, 960, 50, 540, 960, 1100);
    bg.addColorStop(0, '#1c0b33'); bg.addColorStop(1, '#030106'); ctx.fillStyle = bg; ctx.fillRect(-40,-40,W+80,H+80);
    speedLines(t, prog(t, 0.4, 1.0) * 0.6, YELLOW);
    if (t < 0.35 || (t > 1.02 && t < 1.14) || t > 1.6) bolt(Math.floor(t*16) + 1, 620, -40, 470, 1500, 7, '#9fd8ff');
    const word = 'FLASH', font = '330px Anton';
    ctx.font = font; const total = ctx.measureText(word).width;
    let x = 540 - total/2;
    const zoom = 1 + eIn(prog(t, 1.55, 2.0)) * 7, fade = 1 - prog(t, 1.75, 2.0);
    ctx.save(); ctx.translate(540, 1000); ctx.scale(zoom, zoom); ctx.translate(-540, -1000); ctx.globalAlpha = fade;
    for (let i = 0; i < word.length; i++) {
      const ch = word[i], cw = ctx.measureText(ch).width, a = LETTER_T[i], p = prog(t, a, a + 0.1);
      if (t >= a) {
        const s = lerp(2.6, 1, eOut(p));
        ctx.save(); ctx.translate(x + cw/2, 1000); ctx.scale(s, s);
        rgbText(ch, 0, 110, font, 14 * (1 - prog(t, a, a + 0.25)) + 3, '#fff');
        ctx.restore();
      }
      x += cw;
    }
    ctx.globalAlpha = fade * prog(t, 1.05, 1.15);
    rgbText('75 MPH · STREET-LEGAL · ELECTRIC', 540, 1210, '800 40px Inter', 0, YELLOW);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // ===== 2-12s: night ride =====
  if (t >= 2 && t < 12) {
    ctx.save();
    const push = 1 + 0.05 * prog(t, 2, 11);            // slow camera push-in
    ctx.translate(540, 1200); ctx.scale(push, push); ctx.translate(-540, -1200);
    sky(neon, t);
    skyline(FAR, 2400, d * 0.12, GROUND - 40, '#241046', neon, t);
    skyline(NEAR, 2600, d * 0.3, GROUND, '#0e0620', neon, t);
    streetlights(d, neon);
    road(d, neon);

    // giant outline colour word behind the bike during swaps
    if (t >= 5 && t < 8) {
      ctx.save(); ctx.font = '460px Anton'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = neon; ctx.globalAlpha = 0.85;
      ctx.shadowColor = neon; ctx.shadowBlur = 25;
      const ox = ((t - 5) * 260) % 400;
      ctx.strokeText(COLOR[key].name, 540 + ox - 200, 1330); ctx.restore();
    }

    // bike: rolls in 2.0-2.6, boosts off-screen left 11-11.8
    let cx = 540;
    if (t < 2.6) cx = lerp(1500, 540, eOut(prog(t, 2, 2.6)));
    if (t >= 11) cx = lerp(540, -900, eIn(prog(t, 11.1, 11.8)));
    const swapG = SWAP_T.reduce((g, s) => (t >= s && t < s + 0.12) ? Math.max(g, 1 - (t - s)/0.12) : g, 0);
    drawBike(key, cx, GROUND, 0.86, t, {trail: t < 2.6 ? 1 : (t >= 11 ? 1.6 : 0.35), glitch: swapG, sparks: t > 2.6 && t < 11.8});
    ctx.restore();

    speedLines(t, t < 2.6 ? 0.8 : (t >= 11 ? 1 : 0.35), neon);

    // --- 2-5: speed counter
    if (t < 5) {
      const v = Math.round(75 * eOut(prog(t, 2.2, 3.5)));
      const pop = t >= 3.5 ? lerp(1.35, 1, eOut(prog(t, 3.5, 3.7))) : 1;
      ctx.save(); ctx.translate(540, 560); ctx.scale(pop, pop);
      // gauge arc
      ctx.lineCap = 'round'; ctx.lineWidth = 22; ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(0, 0, 300, Math.PI*0.8, Math.PI*2.2); ctx.stroke();
      ctx.strokeStyle = YELLOW; ctx.shadowColor = YELLOW; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(0, 0, 300, Math.PI*0.8, Math.PI*0.8 + Math.PI*1.4*(v/75)); ctx.stroke(); ctx.shadowBlur = 0;
      rgbText(String(v), 0, 90, '300px Anton', t >= 3.5 ? 10 * (1 - prog(t, 3.5, 3.8)) : 2, '#fff');
      rgbText('MPH', 0, 170, '800 56px Inter', 0, YELLOW);
      ctx.restore();
      ctx.globalAlpha = prog(t, 3.5, 3.6);
      rgbText('TOP SPEED', 540, 250, '800 44px Inter', 0, '#fff');
      ctx.globalAlpha = 1;
    }
    // --- 5-8: colour swaps
    if (t >= 5 && t < 8) {
      const b = Math.floor((t - 5)/BEAT), p = prog(t, 5 + b*BEAT, 5 + b*BEAT + 0.15);
      rgbText('PICK YOUR COLOR', 540, 300, '800 46px Inter', 0, '#fff');
      ctx.save(); ctx.translate(540, 520); ctx.scale(lerp(1.5, 1, eBack(p)), lerp(1.5, 1, eBack(p)));
      rgbText(COLOR[key].name, 0, 0, '230px Anton', 12 * (1 - p), key === 'black' ? '#15151a' : '#fff');
      if (key === 'black') { ctx.lineWidth = 5; ctx.strokeStyle = MAGENTA; ctx.strokeText(COLOR[key].name, 0, 0); }
      ctx.restore();
      ['gray','black','white'].forEach((k, i) => {
        const on = k === key, x = 540 + (i - 1) * 110;
        ctx.beginPath(); ctx.arc(x, 640, on ? 34 : 24, 0, 7);
        ctx.fillStyle = {gray:'#8a8d91', black:'#141418', white:'#f5f5f2'}[k]; ctx.fill();
        ctx.lineWidth = on ? 6 : 3; ctx.strokeStyle = on ? YELLOW : 'rgba(255,255,255,0.5)'; ctx.stroke();
      });
    }
    // --- 8-11: feature slams
    if (t >= 8 && t < 11) {
      const i = Math.min(5, Math.floor((t - 8)/BEAT)), a = 8 + i*BEAT, p = prog(t, a, a + 0.14);
      ctx.save(); ctx.translate(540, 480); ctx.scale(lerp(2.2, 1, eOut(p)), lerp(2.2, 1, eOut(p))); ctx.globalAlpha = prog(t, a, a + 0.05);
      const txt = FEATS[i], size = txt.length > 12 ? 118 : 150;
      rgbText(txt, 0, 0, `${size}px Anton`, 14 * (1 - prog(t, a, a + 0.3)) + 2, '#fff');
      ctx.restore(); ctx.globalAlpha = 1;
      const bw = 300; pill(540 - bw/2, 250, bw, 64, YELLOW);
      rgbText(`0${i+1} / 06`, 540, 296, '800 38px Inter', 0, '#111');
      // progress ticks
      for (let k = 0; k < 6; k++) { ctx.fillStyle = k <= i ? YELLOW : 'rgba(255,255,255,0.25)'; ctx.fillRect(540 - 3*70 + k*70 + 8, 560, 54, 8); }
    }
    // --- 11-12: boost
    if (t >= 11) {
      const p = prog(t, 11, 11.2);
      ctx.save(); ctx.translate(540, 560); ctx.scale(lerp(1.8, 1, eOut(p)), lerp(1.8, 1, eOut(p)));
      rgbText('GONE IN A', 0, -175, '800 60px Inter', 0, YELLOW);
      rgbText('FLASH', 0, 110, '300px Anton', 16 * (1 - prog(t, 11, 11.4)) + 3, '#fff');
      ctx.restore();
      if (t > 11.7) bolt(Math.floor(t*20) + 50, 300, -40, 760, 1500, 9, '#9fd8ff');
    }
  }

  // ===== 12-15: end card =====
  if (t >= 12) {
    ctx.save();
    sky(YELLOW, t);
    ctx.fillStyle = 'rgba(5,2,13,0.45)'; ctx.fillRect(-40, -40, W + 80, H + 80);
    skyline(NEAR, 2600, d * 0.3, 1180, '#0e0620', YELLOW, t);
    road(d, YELLOW, 1180);
    const cx = lerp(1400, 540, eOut(prog(t, 12, 12.5)));
    ctx.translate(0, 0);
    drawBike('gray', cx, 1180, 0.72, t, {trail: 1 - prog(t, 12.2, 12.8), beam: true});
    ctx.restore();
    // brand + offer
    const lp = prog(t, 12.05, 12.3), flick = (t > 12.3 && t < 12.5 && Math.floor(t*40) % 2) ? 0.4 : 1;
    ctx.save(); ctx.translate(540, 470); ctx.scale(lerp(1.6, 1, eBack(lp)), lerp(1.6, 1, eBack(lp))); ctx.globalAlpha = prog(t, 12.05, 12.1) * flick;
    ctx.shadowColor = YELLOW; ctx.shadowBlur = 40; rgbText('FLASH', 0, 0, '270px Anton', 6 * (1 - lp), '#fff'); ctx.restore();
    const line = (txt, y, a, font, col) => { ctx.globalAlpha = prog(t, a, a + 0.12); ctx.save(); ctx.translate(0, 30 * (1 - eOut(prog(t, a, a + 0.25))));
      rgbText(txt, 540, y, font, 0, col); ctx.restore(); ctx.globalAlpha = 1; };
    line('75 MPH · STREET-LEGAL · ELECTRIC', 560, 12.35, '800 36px Inter', 'rgba(255,255,255,0.75)');
    // price on a slab
        line('FROM', 1300, 12.65, '800 40px Inter', 'rgba(255,255,255,0.8)') ;
    if (t > 12.65) { const pp = prog(t, 12.65, 12.85); ctx.save(); ctx.translate(540, 1440); ctx.scale(lerp(1.5, 1, eBack(pp)), lerp(1.5, 1, eBack(pp)));
      ctx.globalAlpha = prog(t, 12.65, 12.7); ctx.shadowColor = YELLOW; ctx.shadowBlur = 30; rgbText('$4,999', 0, 0, '150px Anton', 0, YELLOW); ctx.restore(); ctx.globalAlpha = 1; }
    if (t > 13.0) {
      const bp = prog(t, 13.0, 13.2), pulse = 1 + 0.06 * Math.max(0, Math.sin((t - 13) * Math.PI * 2 / BEAT * 0.5 * 2));
      ctx.save(); ctx.translate(540, 1530); ctx.scale(eBack(bp) * pulse, eBack(bp) * pulse);
      ctx.shadowColor = YELLOW; ctx.shadowBlur = 40; pill(-270, -52, 540, 104, YELLOW); ctx.shadowBlur = 0;
      rgbText('RESERVE YOURS', 0, 18, '800 50px Inter', 0, '#111'); ctx.restore();
    }
    line('$200 refundable deposit  ·  hmpbikes.com', 1640, 13.3, '600 36px Inter', '#fff');
  }

  // ===== post: flash, scanlines, vignette =====
  ctx.setTransform(1,0,0,1,0,0);
  const f = flashAmt(t); if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0,0,W,H); }
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  const vg = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  if (t > 14.7) { ctx.fillStyle = `rgba(0,0,0,${prog(t,14.7,15)})`; ctx.fillRect(0,0,W,H); }
};
